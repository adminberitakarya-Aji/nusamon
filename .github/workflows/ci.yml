name: CI

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validasi data JSON (tools/validate.ps1)
        run: pwsh -File tools/validate.ps1

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unduh Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import aset (sekali — model .glb & audio)
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import
      - name: Jalankan semua suite tes headless
        run: |
          set -e
          for t in $(ls game/tests/test_*.gd | sort); do
            echo "--- $t ---"
            ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "$t"
          done
